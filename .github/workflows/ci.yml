name: ci

# The gate a pull request cannot skip: restore, build with zero warnings, and the whole test suite, on the
# two platforms this product ships for.
#
# Why this exists next to sonar.yml, which also builds and tests. The Sonar job needs a token, runs on one
# operating system, and carries a scanner that changes what "build" means (`eng/sonar-scan.ps1` attaches the
# analyzer set). A contributor's fork has no token, so without this file a pull request can arrive with a red
# build and nothing says so. Windows earns a slot because the CLI prompts, resolves paths and writes files
# differently there — the tests cover it, and only a Windows runner proves it.
#
# It does not duplicate the quality gate: coverage, duplication and the Sonar findings stay in sonar.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One red platform should not hide the other: a path bug on Windows and a test that fails everywhere
      # are different problems, and seeing both in one run is the point of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK global.json pins, kept in step with sonar.yml: the floor is .NET 11, but the compiler is
          # pinned to a patch, and an RC that rolls forward can change what "zero warnings" means.
          dotnet-version: '11.0.100-rc.2.26504.105'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SharpCoreAgent.slnx

      - name: Build
        # No `-warnaserror`: the repository already builds with zero warnings, and the flag would make an
        # SDK-patch analyzer update fail a build that has not changed.
        run: dotnet build SharpCoreAgent.slnx -c Release --no-restore

      - name: Test
        # Microsoft.Testing.Platform is selected by global.json's `test.runner`, so `dotnet test` runs the
        # suite directly — no VSTest adapter, no trx conversion.
        run: dotnet test tests/SharpCoreAgent.Tests/SharpCoreAgent.Tests.csproj -c Release --no-build

